buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }

    // buildscript classpath 也需要强制 Kotlin 编译器版本，否则 AGP 7.2.0
    // 会通过传递依赖把 kotlin-compiler-embeddable 降级到 1.6.x
    configurations.classpath {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10"
            force "org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.10"
            force "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:1.9.10"
            force "org.jetbrains.kotlin:kotlin-daemon-embeddable:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.10"
            force "org.jetbrains.kotlin:kotlin-reflect:1.9.10"
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }

    // 强制所有子项目使用 Kotlin 1.9.10，避免 AGP 7.2.0 内置的 Kotlin 1.6.x 被降级
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.10"
            force "org.jetbrains.kotlin:kotlin-reflect:1.9.10"
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10"
            force "org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.10"
            force "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:1.9.10"
            force "org.jetbrains.kotlin:kotlin-daemon-embeddable:1.9.10"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// AGP 7.2.0 的 extractReleaseAnnotations 任务使用内置 Kotlin 1.6.x 元数据解析器，
// 读取 Kotlin 1.9.x 编译的依赖时会报 "expected version is 1.6.0" 错误。
// 该任务不能禁用（syncReleaseLibJars 依赖其输出 typedefs.txt），但错误是非致命的——
// 任务仍会完成并生成输出文件，只是向 stderr 打印告警。
// 这里通过 Gradle logging 级别静默其 stderr 输出，消除构建日志中的噪声。
// 同时禁用 lintVitalRelease / lintVitalAnalyzeRelease（无下游依赖，可安全禁用）。
subprojects { proj ->
    ['com.android.library', 'com.android.application'].each { pluginId ->
        proj.plugins.withId(pluginId) {
            // 静默 extractReleaseAnnotations 的 Kotlin 元数据版本错误（非致命）
            proj.tasks.matching { it.name == 'extractReleaseAnnotations' }.configureEach {
                logging.captureStandardError LogLevel.QUIET
                logging.captureStandardOutput LogLevel.QUIET
            }
            // lint 任务同样使用旧 Kotlin 解析器，且无下游依赖，直接禁用
            proj.tasks.matching {
                it.name in ['lintVitalAnalyzeRelease', 'lintVitalRelease']
            }.configureEach {
                enabled = false
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
