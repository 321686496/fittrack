workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.fp.fitplan
      vars:
        XCODE_WORKSPACE: Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: 3.7.12
    scripts:
      - name: Install dependencies
        script: |
          cd fittrack_flutter
          flutter pub get
      - name: Patch OHOS fork packages for standard Flutter SDK
        script: |
          python3 -c "
          import os
          patched = []
          for root, dirs, files in os.walk(os.path.expanduser('~/.pub-cache/git')):
              for fname in files:
                  if not fname.endswith('.dart'):
                      continue
                  path = os.path.join(root, fname)
                  try:
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                  except Exception:
                      continue
                  original = content
                  content = content.replace('TargetPlatform.ohos', 'TargetPlatform.linux')
                  content = content.replace('Platform.isOhos', 'Platform.isLinux')
                  if content != original:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      patched.append(path)
          print(f'Patched {len(patched)} file(s) for standard Flutter SDK compatibility')
          for p in patched:
              print(f'  {p}')
          "
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id --project "$CM_BUILD_DIR/ios/Runner.xcodeproj") --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS
        script: |
          cd fittrack_flutter
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - fittrack_flutter/build/ios/ipa/*.ipa
      - fittrack_flutter/build/ios/ipa/*.dSYM.zip

  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.7.12
      vars:
        PACKAGE_NAME: com.fp.fitplan
    scripts:
      - name: Install dependencies
        script: |
          cd fittrack_flutter
          flutter pub get
      - name: Patch OHOS fork packages for standard Flutter SDK
        script: |
          python3 -c "
          import os
          patched = []
          for root, dirs, files in os.walk(os.path.expanduser('~/.pub-cache/git')):
              for fname in files:
                  if not fname.endswith('.dart'):
                      continue
                  path = os.path.join(root, fname)
                  try:
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                  except Exception:
                      continue
                  original = content
                  content = content.replace('TargetPlatform.ohos', 'TargetPlatform.linux')
                  content = content.replace('Platform.isOhos', 'Platform.isLinux')
                  if content != original:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      patched.append(path)
          print(f'Patched {len(patched)} file(s) for standard Flutter SDK compatibility')
          for p in patched:
              print(f'  {p}')
          "
      - name: Build Android APK
        script: |
          cd fittrack_flutter
          flutter build apk --release
    artifacts:
      - fittrack_flutter/build/app/outputs/flutter-apk/*.apk
