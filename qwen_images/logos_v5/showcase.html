<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftTrack Logo 设计方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f7;
    color: #1a1a1a;
    padding: 40px 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 15px;
    color: #888;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }
  .card img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .card .name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card .desc {
    font-size: 13px;
    color: #999;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    color: #FF6B35;
    margin: 40px auto 20px;
    max-width: 1200px;
    padding-left: 4px;
  }
  .section-title:first-of-type { margin-top: 0; }
</style>
</head>
<body>

<div class="header">
  <h1>LiftTrack Logo 设计方案</h1>
  <p>抽象几何组合 · 现代极简 · 白底圆角方框</p>
</div>

<h2 class="section-title">抽象几何方案</h2>
<div class="grid">
  <div class="card">
    <img src="logo_abstract_01.jpg" alt="方案1">
    <div class="name">方案 1</div>
    <div class="desc">双圆连接 · 哑铃抽象</div>
  </div>
  <div class="card">
    <img src="logo_abstract_02.jpg" alt="方案2">
    <div class="name">方案 2</div>
    <div class="desc">弧线 + 闪电 · 能量感</div>
  </div>
  <div class="card">
    <img src="logo_abstract_03.jpg" alt="方案3">
    <div class="name">方案 3</div>
    <div class="desc">拱门形 · 简洁有力</div>
  </div>
  <div class="card">
    <img src="logo_abstract_04.jpg" alt="方案4">
    <div class="name">方案 4</div>
    <div class="desc">圆内菱形 · 几何叠加</div>
  </div>
</div>

<h2 class="section-title">具象融合方案</h2>
<div class="grid">
  <div class="card">
    <img src="logo_A1_L_barbell.jpg" alt="方案A1">
    <div class="name">方案 A1</div>
    <div class="desc">L + 杠铃 · 橙红渐变</div>
  </div>
  <div class="card">
    <img src="logo_B1_ring_dumbbell.jpg" alt="方案B1">
    <div class="name">方案 B1</div>
    <div class="desc">进度环 + 哑铃 · 橙黑配色</div>
  </div>
  <div class="card">
    <img src="logo_C1_LT_monogram.jpg" alt="方案C1">
    <div class="name">方案 C1</div>
    <div class="desc">LT 字母 · 3D 浮雕</div>
  </div>
  <div class="card">
    <img src="logo_D1_muscle_arrow.jpg" alt="方案D1">
    <div class="name">方案 D1</div>
    <div class="desc">肌肉手臂 + 箭头 · 力量进步</div>
  </div>
</div>

</body>
</html>
